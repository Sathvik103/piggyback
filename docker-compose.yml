services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: piggyback
      POSTGRES_PASSWORD: piggyback
      POSTGRES_DB: piggyback
    ports:
      - "5432:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db:/db:ro
      - ./data:/data:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U piggyback -d piggyback"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
