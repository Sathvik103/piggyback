services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: piggyback
      POSTGRES_PASSWORD: piggyback
      POSTGRES_DB: piggyback
    ports:
      - "5433:5432"   # 5433 on the host: avoids clashing with a locally installed Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U piggyback -d piggyback"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://piggyback:piggyback@db:5432/piggyback
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    profiles: ["app"]   # `docker compose --profile app up` runs the API + dashboard too

# The schema is applied by `python -m db migrate`; the API also runs it on start.
volumes:
  pgdata:
