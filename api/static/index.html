<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Piggyback</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <h1>Piggyback</h1>
    <label>Scenario <select id="scenario"></select></label>
    <span class="muted" id="now"></span>
    <label title="Hours a missing scan must be overdue before it is flagged">Grace
      <input id="grace" type="number" min="0" max="24" step="0.5" value="2"> h</label>
    <span class="spacer"></span>
    <label>Plan <select id="plan"><option value="">none yet</option></select></label>
    <select id="solver" aria-label="Solver">
      <option value="cpsat">CP-SAT (optimal)</option>
      <option value="greedy">Greedy</option>
      <option value="none">Do nothing</option>
    </select>
    <button id="run" type="button">Run plan</button>
    <label class="truth" title="Score against the simulator's hidden ground truth">
      <input id="truth" type="checkbox"> Show replay vs truth</label>
  </header>

  <section class="kpis" id="kpis" aria-live="polite"></section>
  <section class="kpis truth-kpis" id="truth-kpis" hidden></section>

  <main>
    <div class="map-wrap">
      <div id="map" role="region" aria-label="Network map"></div>
      <div class="legend" id="legend">
        <div><span class="sw dot"></span>Hub — size = parcels flagged there</div>
        <div><span class="sw line s1"></span>Piggyback route — width = parcels</div>
        <div><span class="sw line s2 dashed"></span>Dedicated truck</div>
        <div><span class="sw line serious dashed"></span>⚠ Lane delay</div>
        <div><span class="sw ring critical"></span>⛔ Hub closure</div>
      </div>
    </div>

    <aside id="side">
      <nav class="tabs" role="tablist">
        <button role="tab" data-tab="detections" aria-selected="true">Detections</button>
        <button role="tab" data-tab="detail" aria-selected="false">Detail</button>
        <button role="tab" data-tab="disruptions" aria-selected="false">Disruptions</button>
      </nav>
      <div class="tab" id="tab-detections">
        <h2>Flagged by kind <span class="muted" id="kind-filter-note"></span></h2>
        <div id="kind-bars" class="bars"></div>
        <div class="table-wrap"><table id="det-table">
          <thead><tr><th>Shipment</th><th>Kind</th><th>Hub</th><th>Priority</th><th class="num">Overdue h</th><th>Plan</th></tr></thead>
          <tbody></tbody>
        </table></div>
        <p class="muted" id="det-count"></p>
      </div>
      <div class="tab" id="tab-detail" hidden><p class="muted">Click a hub on the map or a shipment in the table.</p></div>
      <div class="tab" id="tab-disruptions" hidden></div>
    </aside>
  </main>
  <div id="tip" class="tip" role="tooltip" hidden></div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="app.js"></script>
</body>
</html>
